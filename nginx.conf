server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-term cache for hashed assets (JS/CSS bundles have content-hash filenames)
    location ~* \.(?:js|css|woff2|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No cache for index.html and the PWA manifest — must always be fresh
    location ~* (?:index\.html|manifest\.webmanifest|sw\.js)$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback — Caddy also handles this, kept as a safety net
    location / {
        try_files $uri $uri/ /index.html;
    }
}
